[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./test-out" }, { access = "read-write", path = "./deployments" }]

[profile.ci]
fuzz = { runs = 1024 }

[fuzz]
runs = 256
max_test_rejects = 65536

[fmt]
line_length = 120
tab_width = 4
quote_style = "double"

# 本地 Anvil / 测试网 RPC 通过环境变量传入，见 .env.example
# [rpc_endpoints]
# sepolia = "${SEPOLIA_RPC_URL}"
# mainnet = "${MAINNET_RPC_URL}"
